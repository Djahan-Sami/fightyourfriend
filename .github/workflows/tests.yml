name: Tests du jeu

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer le projet
        uses: actions/checkout@v4

      - name: Installer Godot 4.7.2
        run: |
          curl --fail --location --retry 3 \
            --output godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7.2-stable_linux.x86_64 godot
          chmod +x godot

      - name: Importer les ressources
        run: ./godot --headless --path 01_JEU --editor --quit-after 120

      - name: Tester le combat
        run: |
          ./godot --headless --path 01_JEU res://test_external_animation.tscn
          ./godot --headless --path 01_JEU res://test_feel.tscn
          ./godot --headless --path 01_JEU res://test_grab.tscn
          ./godot --headless --path 01_JEU res://test_balance.tscn
          ./godot --headless --path 01_JEU res://test_photo.tscn
          ./godot --headless --path 01_JEU res://test_ui.tscn

      - name: Verifier le menu et une partie
        run: |
          ./godot --headless --path 01_JEU --quit-after 60
          ./godot --headless --path 01_JEU --quit-after 180 res://arena3d.tscn
